<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unified Harness Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 3rem 2rem; background: #f5f5f5; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; align-items: center; }
    h1 { font-family: 'Instrument Serif', serif; font-size: 2rem; font-weight: 400; color: #2d3142; margin-bottom: 0.5rem; letter-spacing: 0.02em; }
    p { font-family: 'Geist Mono', monospace; font-size: 0.875rem; color: #4f5d75; margin-top: 0; margin-bottom: 3rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .diagram-container { max-width: 900px; width: 100%; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="diagram-container">
    <h1>Unified Harness Architecture</h1>
    <p>Component Overview &amp; Control Flow</p>
    
    <svg viewBox="0 0 800 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="unified-arch-title unified-arch-desc">
      <title id="unified-arch-title">Unified Harness Architecture</title>
      <desc id="unified-arch-desc">High-level architecture diagram showing the Control Ledger, Work Plane, Context Plane, Execution Plane, and Event Bus.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- CONNECTORS -->
      <!-- Input -> Gateway -->
      <path d="M 400,104 V 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="126" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="135" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMAND</text>

      <!-- Gateway -> Context Plane -->
      <path d="M 376,224 V 244 Q 376,252 368,252 H 168 Q 160,252 160,260 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Gateway -> Work Plane -->
      <path d="M 400,224 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="376" y="246" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="255" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <!-- Gateway -> Execution Plane -->
      <path d="M 424,224 V 244 Q 424,252 432,252 H 632 Q 640,252 640,260 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Context Plane -> Canonical FS -->
      <path d="M 160,344 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="142" y="366" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="160" y="375" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <!-- Work Plane -> Control Ledger -->
      <path d="M 400,344 V 400" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="382" y="366" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="375" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEASE</text>

      <!-- Context Plane -> Control Ledger -->
      <path d="M 184,344 V 364 Q 184,372 192,372 H 352 Q 360,372 360,380 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="254" y="354" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <!-- Execution Plane -> Control Ledger -->
      <!-- Crosses Work->Event at x=504, needs bridge -->
      <path d="M 616,344 V 364 Q 616,372 608,372 H 448 Q 440,372 440,380 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="510" y="354" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="363" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- Execution Plane -> Repos -->
      <path d="M 640,344 V 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="622" y="366" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="375" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLONE</text>

      <!-- Execution -> Event Bus -->
      <path d="M 712,312 H 736 Q 744,312 744,320 V 544 Q 744,552 736,552 H 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="726" y="426" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="744" y="435" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

      <!-- Work -> Event Bus -->
      <!-- With bridge over Exec->Ledger at y=372 -->
      <path d="M 472,296 H 496 Q 504,296 504,304 V 364 a 8,8 0 0,0 0,16 V 528 Q 504,536 496,536 H 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="486" y="416" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

      <!-- Context -> Event Bus -->
      <!-- With bridge over Context->Ledger at y=372 -->
      <path d="M 232,312 H 280 Q 288,312 288,320 V 364 a 8,8 0 0,0 0,16 V 544 Q 288,552 296,552 H 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="270" y="426" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="288" y="435" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

      <!-- NODES -->
      <!-- Desktop / CLI -->
      <rect x="328" y="40" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="40" width="144" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="336" y="46" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="358" y="55" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="400" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator &amp; CLI</text>
      <text x="400" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP / MCP / IPC</text>

      <!-- Command Gateway -->
      <rect x="328" y="160" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="160" width="144" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="336" y="166" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.20)" stroke-width="0.8"/>
      <text x="364" y="175" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SECURITY</text>
      <text x="400" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Command Gateway</text>
      <text x="400" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Auth &amp; Policy</text>

      <!-- Context Plane -->
      <rect x="88" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="280" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="96" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="116" y="295" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANE</text>
      <text x="160" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Context Plane</text>
      <text x="160" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Retrieval &amp; Parsing</text>

      <!-- Work Plane -->
      <rect x="328" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="280" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="336" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="356" y="295" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANE</text>
      <text x="400" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Work Plane</text>
      <text x="400" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Scheduler &amp; Dispatch</text>

      <!-- Execution Plane -->
      <rect x="568" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="280" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="576" y="286" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="596" y="295" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLANE</text>
      <text x="640" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execution Plane</text>
      <text x="640" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">node-pty / Git</text>

      <!-- Canonical FS -->
      <rect x="88" y="400" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="400" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="96" y="406" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="116" y="415" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="160" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Canonical FS</text>
      <text x="160" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">viking:// namespace</text>

      <!-- Control Ledger -->
      <rect x="328" y="400" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="400" width="144" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="336" y="406" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="366" y="415" fill="rgba(235,108,54,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTHORITY</text>
      <text x="400" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Control Ledger</text>
      <text x="400" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Embedded SQLite</text>

      <!-- Code Repos -->
      <rect x="568" y="400" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="400" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="576" y="406" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="596" y="415" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="640" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repositories</text>
      <text x="640" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Git worktrees</text>

      <!-- Event Bus -->
      <rect x="328" y="520" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="520" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="336" y="526" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="356" y="535" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="400" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Event Bus</text>
      <text x="400" y="570" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Append-only log</text>

      <!-- LEGEND -->
      <line x1="120" y1="620" x2="680" y2="620" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="120" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      
      <rect x="200" y="628" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="220" y="638" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Authority</text>

      <rect x="296" y="628" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="316" y="638" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Security</text>

      <rect x="388" y="628" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="638" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Control Plane</text>

      <rect x="500" y="628" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="520" y="638" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store</text>
      
      <rect x="576" y="628" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="596" y="638" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input</text>
    </svg>
  </div>
</body>
</html>
